<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Minutes</title>
<meta name="description" content="What to do in the first minutes of an emergency, step by step, with pictures.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="First Minutes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #F6F4EF; --card: #FFFFFF; --ink: #16202E; --muted: #5A6475; --line: #E2DDD3; --soft: #ECE8E0;
  --red: #D92D20; --red-press: #B42318; --green: #14935F; --blue: #2F6FED; --art: #F1EEE7;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0F151E; --card: #18212D; --ink: #EEF2F7; --muted: #A2ADBC; --line: #2A3546; --soft: #202A38; --art: #F1EEE7; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0F151E; --card: #18212D; --ink: #EEF2F7; --muted: #A2ADBC; --line: #2A3546; --soft: #202A38; --art: #F1EEE7; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
h1, h2 { text-wrap: balance; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; }

/* home */
.home { padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 850; font-size: 21px; letter-spacing: -0.01em; }
.logo { width: 34px; height: 34px; }
.tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1.5px solid var(--line); border-radius: 99px; padding: 3px 10px; }
.call911 { display: flex; align-items: center; gap: 16px; background: var(--red); color: #fff; border-radius: 22px; padding: 16px 20px; min-height: 84px; box-shadow: 0 10px 24px -14px rgba(217, 45, 32, .9); }
.call911:active { background: var(--red-press); }
.call911 > svg { width: 50px; height: 50px; padding: 12px; background: rgba(255,255,255,.18); border-radius: 50%; flex: none; }
.call911 b { display: block; font-size: 26px; line-height: 1.1; }
.call911 small { font-size: 15px; opacity: .92; }
.search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 0 16px; min-height: 58px; }
.search:focus-within { border-color: var(--blue); }
.search svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 19px; padding: 14px 0; }
.label { margin: 8px 0 0; font-size: 13px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.tiles, .results, .who { display: flex; flex-direction: column; gap: 12px; }
.tile, .whob { display: flex; align-items: center; gap: 14px; background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 10px 14px 10px 10px; min-height: 108px; }
.tile:active, .whob:active { border-color: var(--blue); transform: scale(.99); }
.tart, .wart { width: 118px; height: 88px; flex: none; background: var(--art); border-radius: 16px; overflow: hidden; display: grid; place-items: center; }
.tart svg, .wart svg { width: 100%; height: 100%; }
.tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tx b { font-size: 23px; line-height: 1.15; }
.tx small { font-size: 15px; color: var(--muted); margin-top: 2px; }
.chev { width: 24px; height: 24px; color: var(--muted); flex: none; }
.soon { background: var(--soft); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; }
.soon b { font-size: 19px; } .soon small { color: var(--muted); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chips span { font-size: 14px; font-weight: 650; color: var(--muted); background: var(--soft); border-radius: 99px; padding: 6px 12px; }
.install { background: var(--card); border: 2px dashed var(--line); border-radius: 20px; padding: 14px 16px; }
.install h2 { margin: 0 0 4px; font-size: 18px; }
.install p { margin: 0; font-size: 15px; color: var(--muted); }
.fine { font-size: 13px; color: var(--muted); margin: 4px 2px 0; }

/* screens */
.screen { min-height: 100vh; display: flex; flex-direction: column; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; background: var(--bg); padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
.ib { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border: 0; border-radius: 14px; background: var(--soft); color: var(--ink); cursor: pointer; }
.ib svg { width: 24px; height: 24px; }
.voice[aria-pressed="false"] { color: var(--muted); }
.crumb { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.crumb b { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb span { font-size: 14px; color: var(--muted); }
.call { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--red); color: #fff; font-weight: 900; font-size: 18px; flex: none; }
.call svg { width: 18px; height: 18px; }
.prog { height: 6px; background: var(--soft); margin: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--blue); border-radius: 3px; transition: width .25s; }
.body { flex: 1; padding: 12px max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left)); }
.pad { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.q { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; }
.answers { display: flex; flex-direction: column; gap: 12px; }
.ans { display: flex; flex-direction: column; justify-content: center; border-radius: 22px; padding: 18px 20px; min-height: 104px; }
.ans b { font-size: 24px; line-height: 1.15; } .ans small { font-size: 16px; opacity: .9; margin-top: 4px; }
.ans.no { background: var(--red); color: #fff; }
.ans.yes { background: var(--card); border: 2px solid var(--green); color: var(--ink); }
.ans.yes small { color: var(--green); opacity: 1; font-weight: 700; }
.art { background: var(--art); border-radius: 22px; overflow: hidden; touch-action: pan-y; }
.art svg { width: 100%; height: auto; aspect-ratio: 360 / 260; }
.txt { padding: 14px 2px 0; display: flex; flex-direction: column; gap: 10px; }
.count { margin: 0; font-size: 13px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; color: var(--blue); }
.txt h1 { margin: 0; font-size: 29px; line-height: 1.12; letter-spacing: -0.01em; }
.d { margin: 0; font-size: 20px; line-height: 1.45; }
.more { display: flex; gap: 10px; margin: 2px 0 0; background: var(--soft); border-radius: 16px; padding: 12px 14px; font-size: 16.5px; }
.more svg { width: 22px; height: 22px; color: var(--blue); flex: none; margin-top: 1px; }
.branch { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--green); color: var(--ink); border-radius: 18px; padding: 14px 16px; font-weight: 800; font-size: 18px; }
.branch .chev { color: var(--green); }
.cta { display: flex; align-items: center; justify-content: center; min-height: 64px; border-radius: 18px; background: var(--red); color: #fff; font-weight: 900; font-size: 21px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 10px; max-width: 560px; margin: 0 auto; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 18px max(16px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left)); }
.nav a { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 66px; border-radius: 20px; font-weight: 850; font-size: 20px; }
.nav .back { flex: 0 0 34%; background: var(--card); border: 2px solid var(--line); }
.nav .next { flex: 1; background: var(--ink); color: var(--bg); }
.nav .next .chev { color: inherit; }

/* CPR beat */
.metro { display: flex; align-items: center; gap: 16px; background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 14px; }
.beat { position: relative; width: 128px; height: 128px; flex: none; border: 0; border-radius: 50%; background: var(--blue); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font: inherit; }
.beat .num { font-size: 30px; font-weight: 900; line-height: 1; position: relative; }
.beat .hint { font-size: 13px; font-weight: 700; opacity: .9; position: relative; }
.pulse { position: absolute; inset: 0; border-radius: 50%; background: var(--blue); }
.metro.on .beat .num { font-size: 46px; }
.metro.hit .pulse { animation: hit .5s ease-out; }
.metro.rest .beat, .metro.rest .pulse { background: var(--red); }
@keyframes hit { from { transform: scale(1.14); opacity: .55; } to { transform: scale(1); opacity: 1; } }
.mside { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.mtime { margin: 0; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.mstate { margin: 0; font-size: 16px; color: var(--muted); }
.metro.rest .mstate:first-of-type { color: var(--red); font-weight: 800; }
.tog { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 650; }
.tog input { width: 22px; height: 22px; margin: 0; accent-color: var(--blue); flex: none; }

@media (max-width: 380px) {
  .tart, .wart { width: 96px; height: 74px; }
  .tx b { font-size: 20px; }
  .txt h1 { font-size: 26px; }
  .d { font-size: 18.5px; }
  .beat { width: 112px; height: 112px; }
}
/* tabs, grids and the extra sections */
.tabbed { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; background: var(--card); border-top: 1.5px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: 12px; font-weight: 750; text-align: center; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--green); background: var(--soft); }
.top .call.mini { height: 40px; padding: 0 12px; font-size: 16px; }
.lead { margin: -4px 0 0; font-size: 16px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mtile { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 8px 8px 10px; }
.mtile:active { border-color: var(--blue); }
.mart { display: block; background: var(--art); border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; }
.mart svg { width: 100%; height: 100%; }
.mtile b { font-size: 16.5px; line-height: 1.2; padding: 0 2px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card hr { border: 0; border-top: 1.5px dashed var(--line); margin: 4px 0; width: 100%; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 750; color: var(--muted); }
.card input, .qcard input { font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; }
.card input:focus { outline: 2px solid var(--blue); border-color: transparent; }
.row { display: flex; gap: 8px; }
.row .small { flex: 0 0 38%; }
.member .big { font-weight: 800; }
.add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 16px; border: 2px dashed var(--green); background: transparent; color: var(--green); font: inherit; font-weight: 850; font-size: 17px; cursor: pointer; }
.add svg, .ghost svg, .pcard svg, .cta svg { width: 20px; height: 20px; flex: none; }
.ghost { align-self: flex-start; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 700; padding: 4px 0; cursor: pointer; }
.cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pcard { display: flex; flex-direction: column; gap: 4px; background: var(--green); color: #fff; border-radius: 16px; padding: 12px 10px; }
.pcard b { font-size: 15px; line-height: 1.15; }
.pcard small { font-size: 12px; opacity: .9; }
@media (max-width: 380px) { .cards3 { grid-template-columns: 1fr; } }
.checks { gap: 0; padding: 4px 14px; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 16.5px; }
.check:last-child { border-bottom: 0; }
.check input { width: 24px; height: 24px; flex: none; accent-color: var(--green); margin: 0; }
.prog2 b { font-size: 18px; }
.kbar { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.kbar i { display: block; height: 100%; background: var(--green); }
.tips p { margin: 0; font-size: 15.5px; }
.cta.soft { background: var(--card); color: var(--ink); border: 2px solid var(--line); gap: 8px; font-size: 18px; }
.cta.mini { min-height: 42px; padding: 0 14px; font-size: 16px; gap: 6px; border: 0; cursor: pointer; font-family: inherit; }
button.cta { border: 0; width: 100%; cursor: pointer; font-family: inherit; }
.certcard { flex-direction: row; align-items: center; gap: 12px; }
.certcard > svg { width: 40px; height: 40px; color: var(--green); flex: none; }
.certcard b { display: block; font-size: 18px; }
.certcard small { color: var(--muted); font-size: 14.5px; }
.qcard .q { font-size: 24px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; font: inherit; font-size: 17.5px; font-weight: 700; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; }
.opt.right { border-color: var(--green); background: #E3F5EC; color: #0B5E3C; }
.opt.wrong { border-color: var(--red); background: #FDE8E6; color: #8E1F16; }
.why { margin: 0; font-size: 16px; font-weight: 650; }
/* printable pages */
.printwrap { padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
.pbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pbar b { flex: 1; font-size: 18px; }
.sheet { background: #fff; color: #16202E; border-radius: 14px; padding: 18px; font-size: 14px; line-height: 1.4; }
.sheet h1 { display: flex; align-items: center; gap: 10px; font-size: 22px; margin: 0 0 10px; }
.sheet h1 .logo { width: 30px; height: 30px; }
.sheet h2 { font-size: 16px; margin: 14px 0 6px; }
.sheet h3 { font-size: 14.5px; margin: 0 0 2px; }
.sheet p { margin: 2px 0; }
.big911 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; background: #D92D20; color: #fff; border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.big911 b { font-size: 26px; }
.say { margin: 10px 0; border: 2px solid #D92D20; border-radius: 10px; padding: 8px 12px; }
.ptable { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
.ptable th, .ptable td { border: 1px solid #C9CFD8; padding: 6px 8px; text-align: left; vertical-align: top; }
.ptable th { background: #F1EEE7; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.quick > div { border: 1px solid #C9CFD8; border-radius: 10px; padding: 8px 10px; }
.plain { margin: 0; padding-left: 18px; }
.boxes { list-style: none; padding: 0; columns: 2; margin: 0; }
.boxes li { padding: 3px 0 3px 26px; position: relative; break-inside: avoid; }
.boxes li::before { content: ""; position: absolute; left: 0; top: 4px; width: 15px; height: 15px; border: 2px solid #16202E; border-radius: 3px; }
.boxes li.ok::after { content: ""; position: absolute; left: 5px; top: 6px; width: 5px; height: 9px; border: solid #14935F; border-width: 0 3px 3px 0; transform: rotate(45deg); }
.small { font-size: 12px; color: #5A6475; margin-top: 12px; }
.wallet { display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 6.8in; background: #fff; color: #16202E; border: 1.5px dashed #9AA3AE; font-size: 11.5px; line-height: 1.35; }
.wside { padding: 10px; border-right: 1.5px dashed #9AA3AE; }
.wside:last-child { border-right: 0; }
.wside h3 { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin: 0 0 6px; }
.wside h3 .logo { width: 18px; height: 18px; }
.wside p { margin: 3px 0; }
.cert { background: #fff; color: #16202E; border-radius: 10px; padding: 14px; }
.cert-in { border: 3px solid #14935F; outline: 1.5px solid #14935F; outline-offset: 6px; border-radius: 8px; padding: 26px 18px; text-align: center; }
.cert-in .logo { width: 46px; height: 46px; margin: 0 auto; }
.ck { font-size: 26px; font-weight: 900; letter-spacing: .02em; margin: 10px 0 6px; color: #0B5E3C; }
.cs { margin: 6px 0; font-size: 15px; }
.cn { font-size: 30px; font-weight: 800; margin: 8px 0; border-bottom: 2px solid #C9CFD8; display: inline-block; padding: 0 18px 4px; }
.cf { font-size: 11.5px; color: #5A6475; margin-top: 16px; }
@media (max-width: 480px) { .cols2 { grid-template-columns: 1fr; } .boxes { columns: 1; } .wallet { grid-template-columns: 1fr; } .wside { border-right: 0; border-bottom: 1.5px dashed #9AA3AE; } }
@media print {
  @page { margin: 0.5in; }
  body { background: #fff !important; }
  .noprint, .tabbar { display: none !important; }
  #app { max-width: none; }
  .printwrap { padding: 0; }
  .sheet, .cert { border-radius: 0; padding: 0; }
  .cols2 { grid-template-columns: 1fr 1fr; }
  .boxes { columns: 2; }
  .wallet { grid-template-columns: 1fr 1fr; }
  .wside { border-right: 1.5px dashed #9AA3AE; border-bottom: 0; }
  .big911, .ptable th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
/* voice search, hands free mode, expiry dates */
.search .mic.srch { flex: none; width: 46px; height: 46px; margin-right: -8px; border: 0; border-radius: 14px; background: var(--green); color: #fff; display: grid; place-items: center; cursor: pointer; }
.search .mic.srch svg { width: 24px; height: 24px; }
.mic.live { background: var(--red) !important; color: #fff !important; animation: live 1.2s ease-in-out infinite; }
@keyframes live { 50% { box-shadow: 0 0 0 8px rgba(217, 45, 32, .18); } }
.ib.mic.onhf { background: var(--green); color: #fff; }
.listening { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 8; display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 9px 16px; font-size: 14.5px; white-space: nowrap; box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .5); }
.listening i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: live 1.2s ease-in-out infinite; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); z-index: 9; max-width: 520px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; font-size: 15.5px; font-weight: 650; opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.alertbar { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 10px 14px; background: #FFF4DB; color: #6B4A00; border: 2px solid #F2C94C; }
.alertbar.bad { background: #FDE8E6; color: #8E1F16; border-color: #F3A39A; }
.alertbar > svg:first-child { width: 26px; height: 26px; flex: none; }
.alertbar span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.alertbar b { font-size: 16px; } .alertbar small { font-size: 13.5px; opacity: .9; }
.tab { position: relative; }
.tab .dot { position: absolute; top: 4px; left: calc(50% + 8px); width: 11px; height: 11px; border-radius: 50%; background: var(--red); border: 2px solid var(--card); }
.kitem { border-bottom: 1px solid var(--line); }
.kitem:last-child { border-bottom: 0; }
